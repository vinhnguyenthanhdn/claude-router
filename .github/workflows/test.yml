name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.json | ForEach-Object {
            Write-Host "Validating $($_.FullName)"
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Scan for secrets and private identifiers
        shell: powershell
        run: .\tests\scan-secrets.ps1

      - name: Run isolated behavior tests
        shell: powershell
        run: .\tests\run-tests.ps1

  posix-shell:
    # The shell side of the config layer, on the two platforms it is being
    # ported to. Node is what parses the config, so both supported floors run.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Found by extension or shebang, not by a list of names. A list has to be
      # edited every time a script is added, and the edit that is forgotten is
      # invisible: the step stays green while the new script is never parsed.
      - name: Parse shell scripts
        run: |
          set -eu
          found=0
          for file in $(git ls-files); do
            case "$file" in
              *.sh) ;;
              *)
                case "$(head -c 32 "$file" 2>/dev/null)" in
                  '#!/bin/sh'*|'#!/usr/bin/env sh'*) ;;
                  *) continue ;;
                esac
                ;;
            esac
            echo "Parsing $file"
            sh -n "$file"
            found=$((found + 1))
          done
          echo "Parsed $found shell script(s)."
          if [ "$found" -eq 0 ]; then
            echo "No file carried a POSIX sh shebang — the scan must never be empty."
            exit 1
          fi

      - name: Run isolated behavior tests
        run: sh tests/run-tests.sh

      - name: Run VSCode JSONC regression tests
        run: sh tests/vscode-switch-jsonc.sh
